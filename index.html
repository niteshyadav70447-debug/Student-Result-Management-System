
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Result Management System</h1>
        <p>Manage Student Records and Results</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Add New Student</h2>

            <form id="studentForm">
                <input type="text" id="name" placeholder="Student Name" required>

                <input type="text" id="rollNumber" placeholder="Roll Number" required>

                <input type="text" id="className" placeholder="Class" required>

                <h3>Enter Subject Marks</h3>

                <input type="number" id="english" placeholder="English Marks" required>

                <input type="number" id="maths" placeholder="Maths Marks" required>

                <input type="number" id="science" placeholder="Science Marks" required>

                <input type="number" id="computer" placeholder="Computer Marks" required>

                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="students-section">
            <h2>Student Records</h2>

            <input type="text" id="searchInput" placeholder="Search by name or roll number">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Class</th>
                            <th>Total</th>
                            <th>Percentage</th>
                            <th>Grade</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
